name: Mise en production

# Déclenchement manuel. L'environnement `production` exige l'approbation d'un relecteur
# avant toute étape : les migrations sont appliquées, puis la branche `production`
# avance sur `main`, ce qui déclenche le déploiement Vercel.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Migrer la production puis déployer
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Migrations en attente
        run: supabase db push --dry-run
      - name: Appliquer les migrations
        run: supabase db push
      - name: Avancer la branche production sur main
        run: git push origin main:production
