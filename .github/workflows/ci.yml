name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Application (types, lint, build, tests unitaires)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: Migrations (contrôle et base locale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Opérations destructives
        run: node scripts/check-migrations.mjs
      - name: Historique des migrations inchangé
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs --base origin/${{ github.base_ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Base locale et tests
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase db reset
          supabase test db
          pnpm seed:test
      - run: pnpm test:integration
      - name: Variables de l'application
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
      - name: Tests de bout en bout
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
